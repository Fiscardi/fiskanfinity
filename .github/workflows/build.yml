name: Compilar TikFinity Lite (Windows)

on:
  push:
  workflow_dispatch:

jobs:
 build-windows:
    runs-on: windows-2022
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js (en el servidor de GitHub, no en tu PC)
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1

      - name: Instalar dependencias
        run: npm install --foreground-scripts

      - name: Verificar que memoryjs compiló
        shell: pwsh
        run: |
          if (Test-Path "node_modules/memoryjs/build/Release/memoryjs.node") {
            Write-Host "OK: memoryjs.node se generó correctamente"
          } else {
            Write-Error "FALLO: memoryjs.node NO se generó"
            exit 1
          }

      - name: Compilar el instalador (.exe)
        run: npm run dist -- --publish=never

      - name: Subir el instalador como descargable
        uses: actions/upload-artifact@v4
        with:
          name: TikFinity-Lite-Windows
          path: dist/*.exe
